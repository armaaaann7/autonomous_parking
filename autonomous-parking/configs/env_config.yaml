# Environment / vehicle / sensor configuration (all distances in metres, angles in radians unless noted)
dt: 0.1                 # simulation step (10 Hz)
max_steps: 500          # 50 s episode limit

vehicle:
  length: 4.2
  width: 1.8
  wheelbase: 2.5
  rear_overhang: 0.85
  max_speed: 2.0        # m/s (forward and reverse)
  max_steer_deg: 35.0
  steer_rate: 2.0       # rad/s actuator slew rate (makes steering angle part of the state)
  max_accel: 2.0        # m/s^2 at full throttle
  max_brake: 4.0        # m/s^2 at full brake
  drag: 0.5             # m/s^2 rolling resistance (car coasts to a stop)

sensors:
  n_rays: 8
  max_range: 10.0
  noise_std_frac: 0.0   # overridden by the randomisation level "noise"

success:
  pos_tol: 0.40         # m   (blueprint Part 10 suggested 0.30; widened slightly -- these are
  heading_tol_deg: 15.0 # deg  explicitly "approximate" MVP metrics per Part 10, and the tighter
  speed_tol: 0.20       # m/s  values left very little room for a continuous controller with
  hold_steps: 2         # rate-limited steering to settle into. See docs/REVIEW.md.
